<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Collabs</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F0E8; --bark:#2C2016; --gold:#B8935A; --gold-light:#D4B896; --charcoal:#1A1410;
    --line:rgba(44,32,22,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--bark);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:48px 16px 64px}

  header{text-align:center;margin-bottom:36px}
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:400}
  h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:44px;line-height:1.05;margin:10px 0 12px;color:var(--charcoal)}
  .sub{font-size:14px;line-height:1.6;color:rgba(44,32,22,.7);max-width:420px;margin:0 auto}

  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:28px;position:sticky;top:12px;z-index:5;box-shadow:0 6px 20px rgba(44,32,22,.06)}
  .tab{border:0;background:transparent;font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bark);padding:11px 0;border-radius:999px;cursor:pointer;transition:.25s}
  .tab.active{background:var(--bark);color:var(--cream)}
  .tab .n{display:block;font-size:10px;letter-spacing:.05em;opacity:.55;margin-top:2px}

  .meta{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}
  .meta h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:26px}
  .meta span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}

  .creator{border-bottom:1px solid var(--line)}
  .row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:none;border:0;padding:16px 2px;min-height:96px;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
  .who{display:flex;align-items:center;gap:16px;min-width:0}
  .avatar{width:64px;height:64px;border-radius:50%;flex-shrink:0;object-fit:cover;border:1.5px solid var(--gold-light);background:var(--gold-light);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;color:var(--bark)}
  .name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500}
  .right{display:flex;align-items:center;gap:14px;flex-shrink:0}
  .total{text-align:right}
  .total b{display:block;font-weight:500;font-size:16px;color:var(--charcoal)}
  .total small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(44,32,22,.5)}
  .chev{width:10px;height:10px;border-right:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);transform:rotate(45deg);transition:.3s;margin-top:-4px}
  .creator.open .chev{transform:rotate(225deg);margin-top:4px}

  .links{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
  .creator.open .links{grid-template-rows:1fr}
  .links-inner{overflow:hidden}
  .links-pad{padding:0 0 20px;display:flex;flex-direction:column;gap:8px}
  .link{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;text-decoration:none;color:var(--bark);transition:.2s}
  .link:hover{border-color:var(--gold)}
  .link .plat{display:flex;align-items:center;gap:12px;font-size:14px;letter-spacing:.04em}
  .link svg{width:18px;height:18px;fill:var(--gold)}
  .link .cnt{font-size:13px;color:rgba(44,32,22,.6)}

  .empty{text-align:center;padding:48px 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:rgba(44,32,22,.5)}

  footer{text-align:center;margin-top:48px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
  @media (max-width:380px){ .tab{font-size:11px;letter-spacing:.08em} h1{font-size:38px} }
</style>
</head>

const CATS = [["hair","Hair"],["nails","Nails"],["lashes","Lashes"],["waxing","Waxing"]];
const ICONS = {
  instagram:'<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0 8.2a3.2 3.2 0 110-6.4 3.2 3.2 0 010 6.4zM17.3 5.5a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4zM12 2c-2.7 0-3 0-4.1.1C4.2 2.3 2.3 4.2 2.1 7.9 2 9 2 9.3 2 12s0 3 .1 4.1c.2 3.7 2.1 5.6 5.8 5.8 1.1.1 1.4.1 4.1.1s3 0 4.1-.1c3.7-.2 5.6-2.1 5.8-5.8.1-1.1.1-1.4.1-4.1s0-3-.1-4.1c-.2-3.7-2.1-5.6-5.8-5.8C15 2 14.7 2 12 2zm0 1.8c2.7 0 3 0 4 .1 2.7.1 4 1.4 4.1 4.1.1 1 .1 1.3.1 4s0 3-.1 4c-.1 2.7-1.4 4-4.1 4.1-1 .1-1.3.1-4 .1s-3 0-4-.1c-2.7-.1-4-1.4-4.1-4.1-.1-1-.1-1.3-.1-4s0-3 .1-4C3.9 5.3 5.2 4 7.9 3.9c1-.1 1.3-.1 4.1-.1z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24"><path d="M19.6 6.7a4.8 4.8 0 01-3.8-4.2V2h-3.4v13.7a2.9 2.9 0 11-2-2.8V9.4a6.3 6.3 0 105.4 6.3V8.8a8.2 8.2 0 003.8 1.2V6.7z"/></svg>',
  facebook:'<svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 10-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0022 12z"/></svg>'
};
const LABELS = {instagram:"Instagram", tiktok:"TikTok", facebook:"Facebook"};

const fmt = n => n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M'
              : n>=1e3 ? (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+'K' : String(n);
const total = c => ["instagram","tiktok","facebook"].reduce((s,p)=>s+(c[p]?.followers||0),0);

let current = "hair";

function renderTabs(){
  document.getElementById("tabs").innerHTML = CATS.map(([k,l])=>{
    const n = creators.filter(c=>c.categories.includes(k)).length;
    return `<button class="tab ${k===current?'active':''}" data-k="${k}">${l}<span class="n">${n}</span></button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=b.dataset.k;render();});
}

function render(){
  renderTabs();
  const label = CATS.find(c=>c[0]===current)[1];
  const list = creators.filter(c=>c.categories.includes(current)).sort((a,b)=>total(b)-total(a));
  document.getElementById("catTitle").textContent = label;
  document.getElementById("catCount").textContent = list.length + (list.length===1?" creator":" creators");
  const el = document.getElementById("list");
  if(!list.length){ el.innerHTML = `<div class="empty">No ${label.toLowerCase()} creators yet</div>`; return; }
  el.innerHTML = list.map(c=>{
    const links = ["instagram","tiktok","facebook"].filter(p=>c[p]).map(p=>`
      <a class="link" href="${c[p].url}" target="_blank" rel="noopener">
        <span class="plat">${ICONS[p]}${LABELS[p]}</span>
        <span class="cnt">${c[p].followers==null?"—":fmt(c[p].followers)}</span>
      </a>`).join("");
    return `<div class="creator">
      <button class="row"><span class="who">${c.photo
          ? `<img class="avatar" src="${c.photo}" alt="${c.name}">`
          : `<span class="avatar">${c.name.split(" ").map(w=>w[0]).slice(0,2).join("")}</span>`}
        <span class="name">${c.name}</span></span>
        <span class="right"><span class="total"><b>${fmt(total(c))}</b><small>Followers</small></span><span class="chev"></span></span>
      </button>
      <div class="links"><div class="links-inner"><div class="links-pad">${links}</div></div></div>
    </div>`;
  }).join("");
  el.querySelectorAll(".row").forEach(r=>r.onclick=()=>r.parentElement.classList.toggle("open"));
}
render();
</script>
