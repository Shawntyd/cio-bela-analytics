<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cio Bela | Analytics Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F0E8;
    --gold:#B8935A;
    --gold-light:#D4B896;
    --charcoal:#1A1410;
    --bark:#2C2016;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--charcoal);
    color:var(--cream);
    font-family:'Jost',sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:680px;margin:0 auto;}
  h1{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:2rem;
    margin:0 0 4px;
    color:var(--cream);
  }
  .subtitle{
    font-size:.82rem;
    color:var(--gold-light);
    opacity:.9;
    margin:0 0 20px;
  }
  /* Tabs */
  .tabbar{
    display:flex;
    overflow-x:auto;
    gap:8px;
    padding-bottom:10px;
    margin-bottom:18px;
    border-bottom:1px solid rgba(184,147,90,.25);
    -webkit-overflow-scrolling:touch;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto;
    font-family:'Jost',sans-serif;
    font-size:.8rem;
    font-weight:500;
    letter-spacing:.02em;
    background:var(--bark);
    color:var(--cream);
    opacity:.65;
    border:1px solid rgba(184,147,90,.3);
    border-radius:20px;
    padding:9px 16px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{
    background:var(--gold);
    color:var(--charcoal);
    opacity:1;
    border-color:var(--gold);
    font-weight:600;
  }
  .subtabbar{
    display:flex;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .subtab-btn{
    font-family:'Jost',sans-serif;
    font-size:.75rem;
    background:transparent;
    color:var(--gold-light);
    border:1px solid rgba(184,147,90,.4);
    border-radius:16px;
    padding:6px 14px;
    cursor:pointer;
  }
  .subtab-btn.active{
    background:rgba(184,147,90,.2);
    color:var(--cream);
  }
  /* Link library */
  .link-lib{
    background:var(--bark);
    border:1px solid rgba(184,147,90,.3);
    border-radius:14px;
    padding:16px;
    margin-bottom:22px;
  }
  .link-lib-title{
    font-size:.72rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold-light);
    margin-bottom:10px;
  }
  .link-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid rgba(245,240,232,.08);
  }
  .link-row:last-child{border-bottom:none;}
  .link-info{min-width:0;flex:1;}
  .link-name{
    font-size:.85rem;
    font-weight:500;
    color:var(--cream);
  }
  .link-url{
    font-size:.68rem;
    color:var(--cream);
    opacity:.5;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin-top:1px;
  }
  .copy-btn{
    flex-shrink:0;
    font-family:'Jost',sans-serif;
    font-size:.72rem;
    font-weight:500;
    background:rgba(184,147,90,.2);
    color:var(--gold-light);
    border:1px solid rgba(184,147,90,.4);
    border-radius:8px;
    padding:7px 12px;
    cursor:pointer;
  }
  .copy-btn.copied{background:var(--gold);color:var(--charcoal);}
  .empty-note{font-size:.8rem;opacity:.6;padding:6px 0;}
  .link-group-card{
    border:1px solid rgba(184,147,90,.3);
    border-radius:10px;
    margin-bottom:8px;
    overflow:hidden;
  }
  .link-group-card:last-child{margin-bottom:0;}
  .link-group-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    cursor:pointer;
    background:rgba(184,147,90,.08);
  }
  .link-group-name{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:1.05rem;
    color:var(--gold-light);
  }
  .link-group-count{
    font-size:.68rem;
    opacity:.55;
    margin-top:1px;
  }
  .link-group-chevron{
    font-size:1.1rem;
    color:var(--gold-light);
    transition:transform .2s ease;
    flex-shrink:0;
    margin-left:10px;
  }
  .link-group-chevron.open{transform:rotate(180deg);}
  .link-group-body{
    display:none;
    padding:0 14px;
  }
  .link-group-body.open{display:block;padding:4px 14px 6px;}
  /* Data section */
  .track-btn{
    display:block;
    width:100%;
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:1rem;
    background:var(--gold);
    color:var(--charcoal);
    padding:14px 20px;
    border-radius:10px;
    border:none;
    letter-spacing:.02em;
    cursor:pointer;
    margin-bottom:8px;
  }
  .track-btn:active{background:var(--gold-light);}
  .last-updated{
    text-align:center;
    font-size:.72rem;
    color:var(--cream);
    opacity:.55;
    margin-bottom:20px;
  }
  .filter-box{
    background:var(--bark);
    border:1px solid rgba(184,147,90,.3);
    border-radius:14px;
    padding:16px;
    margin-bottom:18px;
  }
  .filter-group{margin-bottom:14px;}
  .filter-group:last-child{margin-bottom:0;}
  .filter-label{
    font-size:.68rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold-light);
    margin-bottom:8px;
  }
  .filter-pills{display:flex;flex-wrap:wrap;gap:6px;}
  .filter-pill{
    font-family:'Jost',sans-serif;
    font-size:.75rem;
    background:var(--charcoal);
    color:var(--cream);
    opacity:.6;
    border:1px solid rgba(184,147,90,.3);
    border-radius:16px;
    padding:6px 12px;
    cursor:pointer;
  }
  .filter-pill.active{
    background:var(--gold);
    color:var(--charcoal);
    opacity:1;
    border-color:var(--gold);
    font-weight:600;
  }
  .filter-dates{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .filter-dates input{
    background:var(--charcoal);
    color:var(--cream);
    border:1px solid rgba(184,147,90,.3);
    border-radius:8px;
    padding:7px 10px;
    font-family:'Jost',sans-serif;
    font-size:.78rem;
  }
  .filter-dates span{color:var(--cream);opacity:.5;font-size:.75rem;}
  .filter-clear{
    font-family:'Jost',sans-serif;
    font-size:.72rem;
    background:transparent;
    color:var(--gold-light);
    border:1px solid rgba(184,147,90,.4);
    border-radius:16px;
    padding:5px 12px;
    cursor:pointer;
    margin-top:12px;
  }
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:20px;
  }
  .stat-card{
    background:var(--bark);
    border:1px solid rgba(184,147,90,.35);
    border-radius:12px;
    padding:16px;
    text-align:center;
  }
  .stat-num{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:2rem;
    color:var(--gold-light);
    line-height:1;
    margin-bottom:4px;
  }
  .stat-label{
    font-size:.7rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    opacity:.75;
  }
  .section-title{
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:.85rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--gold-light);
    margin:26px 0 12px;
  }
  .visitor-card{
    background:var(--bark);
    border:1px solid rgba(184,147,90,.25);
    border-radius:12px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .visitor-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    cursor:pointer;
  }
  .visitor-name{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:1.1rem;
    color:var(--cream);
  }
  .visitor-meta{
    font-size:.72rem;
    opacity:.65;
    margin-top:2px;
  }
  .visitor-chevron{
    font-size:1.2rem;
    color:var(--gold-light);
    transition:transform .2s ease;
    flex-shrink:0;
    margin-left:10px;
  }
  .visitor-chevron.open{transform:rotate(180deg);}
  .visitor-path{
    display:none;
    padding:0 16px 16px;
    border-top:1px solid rgba(245,240,232,.08);
  }
  .visitor-path.open{display:block;}
  .path-step{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:10px 0;
    border-bottom:1px solid rgba(245,240,232,.06);
    font-size:.85rem;
    gap:10px;
  }
  .path-step:last-child{border-bottom:none;}
  .path-step .step-left{flex:1;min-width:0;}
  .path-num{
    color:var(--gold-light);
    font-size:.72rem;
    margin-right:6px;
  }
  .step-label{color:var(--cream);word-break:break-word;}
  .step-time{color:var(--cream);opacity:.5;font-size:.72rem;margin-top:2px;}
  .step-duration{
    color:var(--gold-light);
    font-size:.78rem;
    white-space:nowrap;
    flex-shrink:0;
  }
  .tag-pill{
    display:inline-block;
    font-size:.65rem;
    background:rgba(184,147,90,.2);
    color:var(--gold-light);
    padding:1px 7px;
    border-radius:20px;
    margin-left:6px;
  }
  .empty{opacity:.6;font-size:.85rem;padding:10px 0;}
  .loading{text-align:center;padding:40px 0;opacity:.7;font-size:.9rem;}
  .error{
    background:rgba(180,60,50,.15);
    border:1px solid rgba(180,60,50,.4);
    border-radius:10px;
    padding:14px;
    font-size:.85rem;
    margin-bottom:20px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Cio Bela Analytics</h1>
    <p class="subtitle" id="subtitle">All traffic sources, in one place</p>

    <div class="tabbar" id="tabbar"></div>
    <div class="subtabbar" id="subtabbar" style="display:none;"></div>

    <div id="linkLib"></div>
    <div id="artistFilterBar" style="display:none;"></div>
    <div class="subtabbar" id="runtabbar" style="display:none;"></div>

    <button class="track-btn" id="trackBtn">Track Now</button>
    <div class="last-updated" id="lastUpdated">Not checked yet</div>

    <div id="content">
      <div class="loading">Tap "Track Now" to load the latest data.</div>
    </div>
  </div>

<script>
const LOG_URL = 'https://raw.githubusercontent.com/Shawntyd/cio-bela-20-off-promo/main/visits.log';
const TEST_CAMPAIGNS = ['connection_test', 'retry_check'];
const TEST_PAGES = ['test', 'retry-test'];

const HAIR = 'https://www.ciobelasalons.com/hair-services';
const LASHES = 'https://www.ciobelasalons.com/1eyelashextensionsthewoodland-stx';
const NAILS = 'https://www.ciobelasalons.com/nail-salon-the-woodlands';
const WAX = 'https://www.ciobelasalons.com/wax-services';
const HOME = 'https://www.ciobelasalons.com';

function artistLinks(name, slug){
  return [
    {label: name + ' — Hair', url: HAIR + '?utm_source=facebook_groups&utm_medium=social&utm_campaign=fb_outreach&utm_content=' + slug},
    {label: name + ' — Lashes', url: LASHES + '?utm_source=facebook_groups&utm_medium=social&utm_campaign=fb_outreach&utm_content=' + slug},
    {label: name + ' — Nails', url: NAILS + '?utm_source=facebook_groups&utm_medium=social&utm_campaign=fb_outreach&utm_content=' + slug},
    {label: name + ' — Wax', url: WAX + '?utm_source=facebook_groups&utm_medium=social&utm_campaign=fb_outreach&utm_content=' + slug}
  ];
}

// Search engines aren't a link we hand out — there's nothing to tag. Instead
// this looks at the referrer every visit already carries and checks it
// against known search engine domains, as long as no utm_source is present
// (an empty utm_source + a search-engine referrer = organic search; a Google
// Ads click would carry its own utm_source and show up under a paid tab instead).
const SEARCH_ENGINE_DOMAINS = ['google.', 'bing.', 'yahoo.', 'duckduckgo.', 'ecosia.', 'baidu.', 'yandex.', 'ask.com', 'aol.'];
function isSearchEngineReferrer(referrer){
  if (!referrer) return false;
  try {
    const host = new URL(referrer).hostname.toLowerCase();
    return SEARCH_ENGINE_DOMAINS.some(d => host.includes(d));
  } catch(e){ return false; }
}

const TABS = {
  artists: {
    label: 'Artists',
    filter: e => e.utm_source === 'facebook_groups',
    grouped: true,
    brandPrefix: true,
    links: [
      ...artistLinks('Savannah','savannah'),
      ...artistLinks('Zoe','zoe'),
      ...artistLinks('Mia','mia'),
      ...artistLinks('Londyn','londyn'),
      ...artistLinks('Shawntavia','shawntavia')
    ]
  },
  search: {
    label: 'Search Engines',
    filter: e => (!e.utm_source || e.utm_source === '') && isSearchEngineReferrer(e.referrer),
    note: 'No link to copy here — this tab reads organic Google/Bing/Yahoo/DuckDuckGo traffic automatically from each visit\'s referrer. Nothing to hand out or tag.'
  },
  qr: {
    label: 'QR Screens',
    filter: e => e.utm_source === 'qr_screens',
    links: [{label:'In-Salon Screens', url: HOME + '?utm_source=qr_screens&utm_medium=offline&utm_campaign=in_salon'}]
  },
  instagram: {
    label: 'Instagram',
    filter: e => e.utm_source === 'instagram' || e.utm_source === 'ig',
    links: [{label:'Bio Link', url: HOME + '?utm_source=instagram&utm_medium=social&utm_campaign=bio_link'}]
  },
  tiktok: {
    label: 'TikTok',
    filter: e => e.utm_source === 'tiktok',
    links: [{label:'Bio Link', url: HOME + '?utm_source=tiktok&utm_medium=social&utm_campaign=bio_link'}]
  },
  facebook: {
    label: 'Facebook',
    filter: e => e.utm_source === 'facebook',
    links: [{label:'Salon Page Link', url: HOME + '?utm_source=facebook&utm_medium=social&utm_campaign=fb_page'}]
  },
  influencers: {
    label: 'Influencers',
    filter: e => e.utm_source === 'influencer',
    grouped: true,
    links: []
  },
  campaigns: {
    label: 'Campaigns',
    isCampaignsHub: true,
    campaignsList: [
      {
        key: 'rose',
        label: 'Rose Campaign',
        filter: e => e.utm_campaign === 'mall_rose_promo' || e.utm_source === 'rose_qr',
        links: [{label:'Rose Promo Page (QR destination)', url: 'https://shawntyd.github.io/cio-bela-20-off-promo/'}]
      }
      // Future campaigns get added here as new entries in this list.
    ]
  },
  searchconsole: {
    label: 'Search Console',
    isSearchConsole: true,
    note: 'Official Google data — real search queries, clicks, impressions, and position, straight from Search Console. Complements the Search Engines tab, which shows visitor paths but can miss traffic when the browser strips referrer info (common on mobile).'
  }
};

let allEntries = [];
let activeTab = 'artists';
let activeSubtab = 'rose';
let activeRunIndex = 0;
let campaignNav = {level: 'list', campaignKey: null, runIndex: null};

function buildTabbar(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  Object.keys(TABS).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (key === activeTab ? ' active' : '');
    btn.textContent = TABS[key].label;
    btn.onclick = () => {
      activeTab = key;
      activeRunIndex = 0;
      campaignNav = {level: 'list', campaignKey: null, runIndex: null};
      renderAll();
    };
    bar.appendChild(btn);
  });
}

function buildSubtabbar(){
  const bar = document.getElementById('subtabbar');
  const tab = TABS[activeTab];
  if (!tab.hasSubtabs){ bar.style.display = 'none'; bar.innerHTML=''; return; }
  bar.style.display = 'flex';
  bar.innerHTML = '';
  Object.keys(tab.subtabs).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'subtab-btn' + (key === activeSubtab ? ' active' : '');
    btn.textContent = tab.subtabs[key].label;
    btn.onclick = () => { activeSubtab = key; activeRunIndex = 0; renderAll(); };
    bar.appendChild(btn);
  });
}

function currentConfig(){
  const tab = TABS[activeTab];
  if (tab.hasSubtabs) return tab.subtabs[activeSubtab];
  return tab;
}

function buildLinkLib(){
  buildLinkLibFor(currentConfig());
}

function buildLinkLibFor(cfg){
  const wrap = document.getElementById('linkLib');
  if (cfg.note){
    wrap.innerHTML = '<div class="link-lib"><div class="link-lib-title">Links</div><div class="empty-note">' + cfg.note + '</div></div>';
    return;
  }
  if (!cfg.links || cfg.links.length === 0){
    wrap.innerHTML = '<div class="link-lib"><div class="link-lib-title">Links</div><div class="empty-note">No links added yet — tell me who to add and I\'ll drop them in here.</div></div>';
    return;
  }

  let html = '<div class="link-lib"><div class="link-lib-title">Links</div>';

  if (cfg.grouped){
    const groups = {};
    const order = [];
    cfg.links.forEach(l => {
      const name = l.label.split(' — ')[0];
      const rest = l.label.split(' — ').slice(1).join(' — ');
      if (!groups[name]){ groups[name] = []; order.push(name); }
      groups[name].push({label: rest, url: l.url});
    });
    order.forEach((name, gi) => {
      const gid = 'linkgrp-' + activeTab + '-' + gi;
      html += '<div class="link-group-card">';
      html += '<div class="link-group-header" onclick="toggleLinkGroup(\'' + gid + '\')">';
      html += '<div><div class="link-group-name">' + escapeHtml(name) + '</div>';
      html += '<div class="link-group-count">' + groups[name].length + ' link' + (groups[name].length===1?'':'s') + '</div></div>';
      html += '<div class="link-group-chevron" id="chev-' + gid + '">&#9662;</div>';
      html += '</div>';
      html += '<div class="link-group-body" id="body-' + gid + '">';
      groups[name].forEach((l, i) => {
        const id = 'link-' + gid + '-' + i;
        html += '<div class="link-row"><div class="link-info">';
        html += '<div class="link-name">' + escapeHtml(l.label) + '</div>';
        html += '<div class="link-url">' + escapeHtml(l.url) + '</div></div>';
        html += '<button class="copy-btn" id="' + id + '" onclick="copyLink(\'' + id + '\',\'' + l.url.replace(/'/g,"\\'") + '\',' + (!!cfg.brandPrefix) + ')">Copy</button>';
        html += '</div>';
      });
      html += '</div></div>';
    });
  } else {
    cfg.links.forEach((l, i) => {
      const id = 'link-' + activeTab + '-' + activeSubtab + '-' + i;
      html += '<div class="link-row"><div class="link-info">';
      html += '<div class="link-name">' + escapeHtml(l.label) + '</div>';
      html += '<div class="link-url">' + escapeHtml(l.url) + '</div></div>';
      html += '<button class="copy-btn" id="' + id + '" onclick="copyLink(\'' + id + '\',\'' + l.url.replace(/'/g,"\\'") + '\',false)">Copy</button>';
      html += '</div>';
    });
  }

  html += '</div>';
  wrap.innerHTML = html;
}

function toggleLinkGroup(gid){
  const body = document.getElementById('body-' + gid);
  const chev = document.getElementById('chev-' + gid);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

const CIO_BELA_INSTAGRAM = 'https://www.instagram.com/ciobelasalon';

function copyLink(id, url, withBrandPrefix){
  const btn = document.getElementById(id);
  const text = withBrandPrefix
    ? `Cio Bela!\n\nWebsite -\n${url}\n\nInstagram -\n${CIO_BELA_INSTAGRAM}`
    : url;
  const done = () => {
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(url, done){
  const ta = document.createElement('textarea');
  ta.value = url;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e){}
  document.body.removeChild(ta);
}

document.getElementById('trackBtn').addEventListener('click', loadData);

async function loadData(){
  const content = document.getElementById('content');
  const btn = document.getElementById('trackBtn');
  btn.disabled = true;
  btn.textContent = 'Loading...';
  content.innerHTML = '<div class="loading">Fetching latest visits...</div>';

  try {
    const resp = await fetch(LOG_URL + '?t=' + Date.now(), {cache:'no-store'});
    if (!resp.ok) throw new Error('Could not reach the log (status ' + resp.status + ')');
    const text = await resp.text();
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    let entries = lines.map(l => {
      try { return JSON.parse(l); } catch(e) { return null; }
    }).filter(e => e !== null);

    entries = entries.filter(e =>
      !TEST_CAMPAIGNS.includes(e.utm_campaign) && !TEST_PAGES.includes(e.page)
    );

    allEntries = entries;
    if (TABS[activeTab].isCampaignsHub) { renderCampaignsHub(); } else { renderData(); }
    document.getElementById('lastUpdated').textContent = 'Last checked: ' + new Date().toLocaleString();
  } catch(e) {
    content.innerHTML = '<div class="error">Couldn\'t load the data right now: ' + e.message + '. Try again in a moment.</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Track Now';
  }
}

function stepLabel(e){
  if (e.event === 'book_now_click') return 'Tapped "For Rose Holders Only"';
  if (e.event === 'instagram_click') return 'Tapped Instagram icon';
  if (e.page === '/') return 'Homepage';
  return e.page || '(unknown page)';
}

function formatDuration(seconds){
  if (seconds === null || seconds === undefined || isNaN(seconds)) return '';
  if (seconds < 60) return seconds + 's';
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return m + 'm ' + s + 's';
}

function clusterSessionsByDate(sessions){
  const GAP_DAYS = 3; // a gap this long between visits = a new campaign run
  const sorted = [...sessions].sort((a,b) => new Date(a.firstSeen) - new Date(b.firstSeen));
  const clusters = [];
  let current = [];
  let lastDate = null;
  sorted.forEach(s => {
    const d = new Date(s.firstSeen);
    if (lastDate && (d - lastDate) > GAP_DAYS * 24 * 60 * 60 * 1000){
      clusters.push(current);
      current = [];
    }
    current.push(s);
    lastDate = d;
  });
  if (current.length) clusters.push(current);

  const fmt = d => d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  const runs = clusters.map(c => {
    const start = new Date(c[0].firstSeen);
    const end = new Date(c[c.length-1].firstSeen);
    const label = fmt(start) === fmt(end) ? fmt(start) : fmt(start) + ' – ' + fmt(end);
    return {label, sessions: [...c].sort((a,b) => new Date(b.firstSeen) - new Date(a.firstSeen))};
  });
  runs.sort((a,b) => new Date(b.sessions[0].firstSeen) - new Date(a.sessions[0].firstSeen));
  return runs;
}

function buildSessions(entries){
  const groups = {};
  entries.forEach(e => {
    const sid = e.session_id || 'unlabeled-' + (e.ts || Math.random());
    (groups[sid] = groups[sid] || []).push(e);
  });

  let sessions = Object.entries(groups).map(([sid, events]) => {
    events.sort((a,b) => new Date(a.ts) - new Date(b.ts));
    const steps = [];
    events.forEach((e, i) => {
      if (e.event === 'exit') return;
      let duration = null;
      const next = events[i+1];
      if (next) {
        duration = Math.round((new Date(next.ts) - new Date(e.ts)) / 1000);
      } else {
        const matchingExit = events.find(x => x.event === 'exit' && x.page === e.page && new Date(x.ts) >= new Date(e.ts));
        if (matchingExit && matchingExit.duration_seconds !== '') duration = Number(matchingExit.duration_seconds);
      }
      steps.push({
        ts: e.ts,
        label: stepLabel(e),
        duration: duration,
        isPage: (e.event || 'view') === 'view',
        tag: e.utm_content || ''
      });
    });
    return {
      id: sid,
      firstSeen: events[0].ts,
      content: events.find(e => e.utm_content)?.utm_content || '',
      pageCount: steps.filter(s => s.isPage).length,
      steps
    };
  });

  sessions = sessions.filter(s => s.steps.length > 0);
  sessions.sort((a,b) => new Date(a.firstSeen) - new Date(b.firstSeen));
  sessions.forEach((s, i) => s.number = i + 1);
  sessions.sort((a,b) => new Date(b.firstSeen) - new Date(a.firstSeen));
  return sessions;
}

const SERVICE_PAGE_MAP = {
  hair: {label:'Hair', page:'/hair-services'},
  lashes: {label:'Lashes', page:'/1eyelashextensionsthewoodland-stx'},
  nails: {label:'Nails', page:'/nail-salon-the-woodlands'},
  wax: {label:'Wax', page:'/wax-services'}
};

let artistFilters = { artists: new Set(), services: new Set(), dateFrom: '', dateTo: '' };
let artistFilterBarOpen = false;

function buildArtistFilterBar(){
  const bar = document.getElementById('artistFilterBar');
  if (activeTab !== 'artists'){ bar.style.display = 'none'; bar.innerHTML = ''; return; }

  const cfg = TABS.artists;
  const names = [];
  cfg.links.forEach(l => {
    const name = l.label.split(' — ')[0];
    if (!names.includes(name)) names.push(name);
  });

  const activeCount = artistFilters.artists.size + artistFilters.services.size
    + (artistFilters.dateFrom ? 1 : 0) + (artistFilters.dateTo ? 1 : 0);

  bar.style.display = 'block';
  let html = '<div class="link-group-card">';
  html += '<div class="link-group-header" onclick="toggleArtistFilterBar()">';
  html += '<div><div class="link-group-name">🔍 Filters' + (activeCount ? ' (' + activeCount + ' active)' : '') + '</div></div>';
  html += '<div class="link-group-chevron' + (artistFilterBarOpen ? ' open' : '') + '">&#9662;</div>';
  html += '</div>';
  html += '<div class="link-group-body' + (artistFilterBarOpen ? ' open' : '') + '" style="padding:' + (artistFilterBarOpen ? '4px 14px 14px' : '0 14px') + ';">';

  html += '<div class="filter-group"><div class="filter-label">Artist</div><div class="filter-pills">';
  names.forEach(name => {
    const active = artistFilters.artists.has(name);
    html += '<button class="filter-pill' + (active?' active':'') + '" onclick="toggleArtistFilter(\'artists\',\'' + name + '\')">' + escapeHtml(name) + '</button>';
  });
  html += '</div></div>';

  html += '<div class="filter-group"><div class="filter-label">Service</div><div class="filter-pills">';
  Object.entries(SERVICE_PAGE_MAP).forEach(([key, s]) => {
    const active = artistFilters.services.has(key);
    html += '<button class="filter-pill' + (active?' active':'') + '" onclick="toggleArtistFilter(\'services\',\'' + key + '\')">' + s.label + '</button>';
  });
  html += '</div></div>';

  html += '<div class="filter-group"><div class="filter-label">Date Range</div><div class="filter-dates">';
  html += '<input type="date" id="filterDateFrom" value="' + artistFilters.dateFrom + '" onchange="setDateFilter(\'dateFrom\',this.value)">';
  html += '<span>to</span>';
  html += '<input type="date" id="filterDateTo" value="' + artistFilters.dateTo + '" onchange="setDateFilter(\'dateTo\',this.value)">';
  html += '</div></div>';

  if (activeCount) html += '<button class="filter-clear" onclick="clearArtistFilters()">Clear All Filters</button>';

  html += '</div></div>';
  bar.innerHTML = html;
}

function toggleArtistFilterBar(){
  artistFilterBarOpen = !artistFilterBarOpen;
  buildArtistFilterBar();
}

function toggleArtistFilter(kind, value){
  const set = artistFilters[kind];
  if (set.has(value)) set.delete(value); else set.add(value);
  buildArtistFilterBar();
  renderData();
}

function setDateFilter(which, value){
  artistFilters[which] = value;
  buildArtistFilterBar();
  renderData();
}

function clearArtistFilters(){
  artistFilters = { artists: new Set(), services: new Set(), dateFrom: '', dateTo: '' };
  buildArtistFilterBar();
  renderData();
}

function sessionMatchesArtistFilters(s){
  if (artistFilters.artists.size && !artistFilters.artists.has(capitalize(s.content))) return false;
  if (artistFilters.services.size){
    const wantedPages = [...artistFilters.services].map(k => SERVICE_PAGE_MAP[k].page);
    const touches = s.steps.some(step => wantedPages.includes(step.label));
    if (!touches) return false;
  }
  if (artistFilters.dateFrom){
    const from = new Date(artistFilters.dateFrom + 'T00:00:00');
    if (new Date(s.firstSeen) < from) return false;
  }
  if (artistFilters.dateTo){
    const to = new Date(artistFilters.dateTo + 'T23:59:59');
    if (new Date(s.firstSeen) > to) return false;
  }
  return true;
}

function getSearchEngineSessionEntries(){
  // A referrer only reflects the page immediately before it — real for page 1
  // of a search visit, but wrong (it's just your own prior page) on page 2+.
  // So: find sessions where NO event carries a utm_source AND at least one
  // event's referrer matches a search engine, then pull in the WHOLE session
  // (every page that visitor touched), not just the one page that happened
  // to still show the Google referrer.
  const bySession = {};
  allEntries.forEach(e => {
    const sid = e.session_id || 'unlabeled';
    (bySession[sid] = bySession[sid] || []).push(e);
  });
  const qualifying = new Set();
  Object.entries(bySession).forEach(([sid, evts]) => {
    const hasUtm = evts.some(e => e.utm_source);
    const hasSearchReferrer = evts.some(e => isSearchEngineReferrer(e.referrer));
    if (!hasUtm && hasSearchReferrer) qualifying.add(sid);
  });
  return allEntries.filter(e => qualifying.has(e.session_id || 'unlabeled'));
}

function renderData(){
  const content = document.getElementById('content');
  const runbar = document.getElementById('runtabbar');
  const cfg = currentConfig();
  const filtered = activeTab === 'search' ? getSearchEngineSessionEntries() : allEntries.filter(cfg.filter);

  if (filtered.length === 0){
    runbar.style.display = 'none'; runbar.innerHTML = '';
    content.innerHTML = '<div class="empty">No visits logged yet on this tab.</div>';
    return;
  }

  let sessions = buildSessions(filtered);
  if (activeTab === 'artists'){
    sessions = sessions.filter(sessionMatchesArtistFilters);
  }

  if (cfg.dateGrouped){
    const runs = clusterSessionsByDate(sessions);
    if (activeRunIndex >= runs.length) activeRunIndex = 0;

    runbar.style.display = 'flex';
    runbar.innerHTML = '';
    runs.forEach((run, ri) => {
      const btn = document.createElement('button');
      btn.className = 'subtab-btn' + (ri === activeRunIndex ? ' active' : '');
      btn.textContent = run.label;
      btn.onclick = () => { activeRunIndex = ri; renderData(); };
      runbar.appendChild(btn);
    });

    const run = runs[activeRunIndex];
    const runViews = run.sessions.reduce((n, s) => n + s.pageCount, 0);
    let html = '<div class="stat-grid">';
    html += statCard(run.sessions.length, 'Visitors');
    html += statCard(runViews, 'Total Page Views');
    html += '</div>';
    html += '<div class="section-title">' + escapeHtml(run.label) + ' — Visitor Paths (' + run.sessions.length + ')</div>';
    html += renderVisitorList(run.sessions, activeTab + '-run' + activeRunIndex);
    content.innerHTML = html;
    return;
  }

  runbar.style.display = 'none'; runbar.innerHTML = '';
  const pageViewCount = sessions.reduce((n, s) => n + s.pageCount, 0);
  let html = '<div class="stat-grid">';
  html += statCard(sessions.length, 'Visitors');
  html += statCard(pageViewCount, 'Total Page Views');
  html += '</div>';

  if (sessions.length === 0){
    html += '<div class="empty">No visits match the current filters.</div>';
    content.innerHTML = html;
    return;
  }

  if (cfg.grouped){
    const groups = {};
    sessions.forEach(s => {
      const key = s.content || 'Unlabeled';
      (groups[key] = groups[key] || []).push(s);
    });
    Object.keys(groups).sort().forEach(key => {
      const groupSessions = groups[key];
      html += '<div class="section-title">' + escapeHtml(capitalize(key)) + ' — Visitor Paths (' + groupSessions.length + ')</div>';
      html += renderVisitorList(groupSessions, activeTab + '-' + key);
    });
  } else {
    html += '<div class="section-title">Visitor Paths (' + sessions.length + ')</div>';
    html += renderVisitorList(sessions, activeTab);
  }

  content.innerHTML = html;
}

function renderVisitorList(sessions, prefix){
  let html = '';
  sessions.forEach((s, idx) => {
    const domId = prefix + '-' + idx;
    const first = new Date(s.firstSeen).toLocaleString();
    html += '<div class="visitor-card">';
    html += '<div class="visitor-header" onclick="toggleVisitor(\'' + domId + '\')">';
    html += '<div><div class="visitor-name">Visitor ' + s.number + '</div>';
    html += '<div class="visitor-meta">' + s.pageCount + ' page' + (s.pageCount===1?'':'s') + ' &middot; started ' + first + '</div></div>';
    html += '<div class="visitor-chevron" id="chev-' + domId + '">&#9662;</div>';
    html += '</div>';
    html += '<div class="visitor-path" id="path-' + domId + '">';
    s.steps.forEach((step, si) => {
      const time = step.ts ? new Date(step.ts).toLocaleTimeString() : '';
      const durationText = step.duration !== null ? formatDuration(step.duration) : (si === s.steps.length-1 ? '—' : '');
      html += '<div class="path-step"><div class="step-left">';
      html += '<span class="path-num">' + (si+1) + '.</span><span class="step-label">' + escapeHtml(step.label) + '</span>';
      if (step.tag) html += '<span class="tag-pill">' + escapeHtml(step.tag) + '</span>';
      html += '<div class="step-time">' + time + '</div></div>';
      html += '<div class="step-duration">' + durationText + '</div></div>';
    });
    html += '</div></div>';
  });
  return html;
}

function toggleVisitor(idx){
  const path = document.getElementById('path-' + idx);
  const chev = document.getElementById('chev-' + idx);
  path.classList.toggle('open');
  chev.classList.toggle('open');
}

function statCard(num, label){
  return '<div class="stat-card"><div class="stat-num">' + num + '</div><div class="stat-label">' + label + '</div></div>';
}

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderAll(){
  buildTabbar();

  if (TABS[activeTab].isCampaignsHub){
    document.getElementById('subtabbar').style.display = 'none';
    document.getElementById('subtabbar').innerHTML = '';
    document.getElementById('runtabbar').style.display = 'none';
    document.getElementById('runtabbar').innerHTML = '';
    document.getElementById('artistFilterBar').style.display = 'none';
    document.getElementById('artistFilterBar').innerHTML = '';
    renderCampaignsHub();
    return;
  }

  if (TABS[activeTab].isSearchConsole){
    document.getElementById('subtabbar').style.display = 'none';
    document.getElementById('subtabbar').innerHTML = '';
    document.getElementById('runtabbar').style.display = 'none';
    document.getElementById('runtabbar').innerHTML = '';
    document.getElementById('artistFilterBar').style.display = 'none';
    document.getElementById('artistFilterBar').innerHTML = '';
    buildLinkLibFor(TABS.searchconsole);
    renderSearchConsole();
    return;
  }

  buildSubtabbar();
  buildLinkLib();
  buildArtistFilterBar();
  if (allEntries.length > 0){
    renderData();
  } else {
    document.getElementById('content').innerHTML = '<div class="loading">Tap "Track Now" to load the latest data.</div>';
  }
}

const SC_WORKER_URL = 'https://cio-bela-search-console.shawntyd96.workers.dev/';
let scDevice = '';
let scDays = 28;
let scData = null;

function renderSearchConsole(){
  const content = document.getElementById('content');
  let html = '<div class="filter-box" style="margin-bottom:18px;">';
  html += '<div class="filter-group"><div class="filter-label">Device</div><div class="filter-pills">';
  [['', 'All'], ['MOBILE','Mobile'], ['DESKTOP','Desktop'], ['TABLET','Tablet']].forEach(([val,label]) => {
    html += '<button class="filter-pill' + (scDevice===val?' active':'') + '" onclick="setScDevice(\'' + val + '\')">' + label + '</button>';
  });
  html += '</div></div>';
  html += '<div class="filter-group"><div class="filter-label">Time Range</div><div class="filter-pills">';
  [[7,'7 days'],[28,'28 days'],[90,'90 days']].forEach(([val,label]) => {
    html += '<button class="filter-pill' + (scDays===val?' active':'') + '" onclick="setScDays(' + val + ')">' + label + '</button>';
  });
  html += '</div></div>';
  html += '</div>';
  html += '<button class="track-btn" onclick="loadSearchConsole()" id="scLoadBtn">Load Search Console Data</button>';
  html += '<div id="scResults">' + (scData ? '' : '<div class="loading" style="margin-top:16px;">Tap above to load.</div>') + '</div>';
  content.innerHTML = html;
  if (scData) renderScResults();
}

function setScDevice(val){ scDevice = val; renderSearchConsole(); if (scData) loadSearchConsole(); }
function setScDays(val){ scDays = val; renderSearchConsole(); if (scData) loadSearchConsole(); }

async function loadSearchConsole(){
  const btn = document.getElementById('scLoadBtn');
  const results = document.getElementById('scResults');
  if (btn){ btn.disabled = true; btn.textContent = 'Loading...'; }
  results.innerHTML = '<div class="loading" style="margin-top:16px;">Fetching from Search Console...</div>';
  try {
    let url = SC_WORKER_URL + '?days=' + scDays;
    if (scDevice) url += '&device=' + scDevice;
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.error){ throw new Error(typeof data.error === 'string' ? data.error : JSON.stringify(data.error)); }
    scData = data;
    renderScResults();
  } catch(e){
    results.innerHTML = '<div class="error">Couldn\'t load Search Console data: ' + escapeHtml(e.message) + '</div>';
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = 'Load Search Console Data'; }
  }
}

function renderScResults(){
  const results = document.getElementById('scResults');
  if (!scData || !scData.rows || scData.rows.length === 0){
    results.innerHTML = '<div class="empty" style="margin-top:16px;">No search data for this range.</div>';
    return;
  }
  const rows = [...scData.rows].sort((a,b) => b.clicks - a.clicks);
  const totalClicks = rows.reduce((n,r) => n + r.clicks, 0);
  const totalImpressions = rows.reduce((n,r) => n + r.impressions, 0);

  let html = '<div class="stat-grid" style="margin-top:16px;">';
  html += statCard(totalClicks, 'Total Clicks');
  html += statCard(totalImpressions, 'Impressions');
  html += '</div>';
  html += '<div class="section-title">Top Search Queries (' + rows.length + ')</div>';

  rows.forEach(r => {
    const query = r.keys[0];
    const page = r.keys[1] || '';
    const ctr = (r.ctr * 100).toFixed(1) + '%';
    const pos = r.position.toFixed(1);
    html += '<div class="visitor-card"><div style="padding:14px 16px;">';
    html += '<div class="visitor-name">"' + escapeHtml(query) + '"</div>';
    html += '<div class="visitor-meta" style="margin-top:4px;word-break:break-all;">Lands on: ' + escapeHtml(page.replace('https://www.ciobelasalons.com','') || '/') + '</div>';
    html += '<div style="display:flex;gap:16px;margin-top:8px;font-size:.78rem;color:var(--gold-light);">';
    html += '<span>' + r.clicks + ' click' + (r.clicks===1?'':'s') + '</span>';
    html += '<span>' + r.impressions + ' impressions</span>';
    html += '<span>' + ctr + ' CTR</span>';
    html += '<span>avg. position ' + pos + '</span>';
    html += '</div></div></div>';
  });
  results.innerHTML = html;
}

function renderCampaignsHub(){
  const content = document.getElementById('content');
  const linkWrap = document.getElementById('linkLib');

  // Level 1: list of campaigns
  if (campaignNav.level === 'list'){
    linkWrap.innerHTML = '';
    let html = '<div class="link-lib"><div class="link-lib-title">Campaigns</div>';
    TABS.campaigns.campaignsList.forEach(camp => {
      html += '<div class="link-group-header" style="border:1px solid rgba(184,147,90,.3);border-radius:10px;margin-bottom:8px;" onclick="openCampaign(\'' + camp.key + '\')">';
      html += '<div class="link-group-name">' + escapeHtml(camp.label) + '</div>';
      html += '<div class="link-group-chevron" style="transform:rotate(-90deg);">&#9662;</div>';
      html += '</div>';
    });
    html += '</div>';
    linkWrap.innerHTML = html;
    content.innerHTML = allEntries.length > 0
      ? '<div class="empty">Tap a campaign above to see its dates.</div>'
      : '<div class="loading">Tap "Track Now" to load data, then pick a campaign above.</div>';
    return;
  }

  const camp = TABS.campaigns.campaignsList.find(c => c.key === campaignNav.campaignKey);
  buildLinkLibFor(camp);

  const filtered = allEntries.filter(camp.filter);
  const sessions = buildSessions(filtered);
  const runs = clusterSessionsByDate(sessions);

  // Level 2: list of dates for this campaign
  if (campaignNav.level === 'campaign'){
    let html = '<button class="copy-btn" onclick="backToCampaignsList()">&larr; Campaigns</button>';
    if (allEntries.length === 0){
      html += '<div class="empty" style="margin-top:16px;">Tap "Track Now" above to load dates for this campaign.</div>';
      content.innerHTML = html;
      return;
    }
    if (runs.length === 0){
      html += '<div class="empty" style="margin-top:16px;">No visits logged for ' + escapeHtml(camp.label) + ' yet.</div>';
      content.innerHTML = html;
      return;
    }
    html += '<div class="section-title">' + escapeHtml(camp.label) + ' — Choose a Date</div>';
    runs.forEach((run, ri) => {
      html += '<div class="link-group-header" style="border:1px solid rgba(184,147,90,.3);border-radius:10px;margin-bottom:8px;" onclick="openCampaignRun(' + ri + ')">';
      html += '<div><div class="link-group-name">' + escapeHtml(run.label) + '</div>';
      html += '<div class="link-group-count">' + run.sessions.length + ' visitor' + (run.sessions.length===1?'':'s') + '</div></div>';
      html += '<div class="link-group-chevron" style="transform:rotate(-90deg);">&#9662;</div>';
      html += '</div>';
    });
    content.innerHTML = html;
    return;
  }

  // Level 3: a specific date's data
  if (campaignNav.level === 'date'){
    const run = runs[campaignNav.runIndex];
    let html = '<button class="copy-btn" onclick="backToCampaignDates()">&larr; ' + escapeHtml(camp.label) + '</button>';
    if (!run){
      html += '<div class="empty" style="margin-top:16px;">No data for this date.</div>';
      content.innerHTML = html;
      return;
    }
    const runViews = run.sessions.reduce((n, s) => n + s.pageCount, 0);
    html += '<div class="stat-grid" style="margin-top:16px;">';
    html += statCard(run.sessions.length, 'Visitors');
    html += statCard(runViews, 'Total Page Views');
    html += '</div>';
    html += '<div class="section-title">' + escapeHtml(run.label) + ' — Visitor Paths (' + run.sessions.length + ')</div>';
    html += renderVisitorList(run.sessions, camp.key + '-date' + campaignNav.runIndex);
    content.innerHTML = html;
  }
}

function openCampaign(key){
  campaignNav = {level: 'campaign', campaignKey: key, runIndex: null};
  renderCampaignsHub();
}
function backToCampaignsList(){
  campaignNav = {level: 'list', campaignKey: null, runIndex: null};
  renderCampaignsHub();
}
function openCampaignRun(ri){
  campaignNav.level = 'date';
  campaignNav.runIndex = ri;
  renderCampaignsHub();
}
function backToCampaignDates(){
  campaignNav.level = 'campaign';
  campaignNav.runIndex = null;
  renderCampaignsHub();
}

renderAll();
